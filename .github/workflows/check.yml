name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Also reject staged changes and untracked generated exports.
      - run: npm run check:reproducible
      - run: npm run check
      - run: npm run check:browser
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        env:
          BRAND_BROWSER: /usr/bin/google-chrome
