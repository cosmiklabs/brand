name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Committed generated files must be exactly what the build produces.
      - run: npm run check:reproducible
      - run: npm run check
      - run: npm run check:browser
        env:
          BRAND_BROWSER: /usr/bin/google-chrome
